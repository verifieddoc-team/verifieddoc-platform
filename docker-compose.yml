services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: verifieddoc
      POSTGRES_PASSWORD: verifieddoc
      POSTGRES_DB: verifieddoc
    ports:
      - "5432:5432"
    volumes:
      - verifieddoc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifieddoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verifieddoc_postgres:
