services:
  - type: web
    runtime: node
    name: verifieddoc-api
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace=@verifieddoc/api && npm run build --workspace=@verifieddoc/api
    preDeployCommand: npm run db:deploy --workspace=@verifieddoc/api
    startCommand: npm run start --workspace=@verifieddoc/api
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false

  - type: web
    runtime: static
    name: verifieddoc-web
    buildCommand: npm ci && npm run build --workspace=@verifieddoc/web
    staticPublishPath: ./apps/web/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEMO_MODE
        value: "true"
