<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">VerifiedDoc backend architecture</title>
  <desc id="description">Web, mobile and public verifier clients communicate with the secure Express API, which uses Prisma to access Supabase PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ee"/>
      <stop offset="1" stop-color="#eef4f5"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243967"/>
      <stop offset="1" stop-color="#315f6a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#18233b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4e7685"/>
    </marker>
    <style>
      .title{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:42px;font-weight:700;fill:#172033}.subtitle{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:19px;font-weight:400;fill:#64707d}.section{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:15px;font-weight:700;fill:#4e7685;letter-spacing:2px}.boxTitle{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:21px;font-weight:700;fill:#172033}.boxText{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#68717b}.apiTitle{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:22px;font-weight:700;fill:#fff}.apiText{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:16px;font-weight:400;fill:#dce8ea}.small{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:14px;font-weight:600;fill:#4e7685}.arrow{fill:none;stroke:#4e7685;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1450" cy="110" r="210" fill="none" stroke="#bdcfce" stroke-width="2" opacity="0.55"/>
  <circle cx="130" cy="890" r="170" fill="none" stroke="#d7c89a" stroke-width="2" opacity="0.55"/>

  <g transform="translate(72 70)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#2b416f" stroke-width="4"/>
    <path d="M15 29l9 9 18-21" fill="none" stroke="#4e7685" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="40" class="title">VerifiedDoc Backend Architecture</text>
    <text x="70" y="74" class="subtitle">Issuer-backed credentials, consent sharing and source verification</text>
  </g>

  <text x="80" y="205" class="section">CLIENT LAYER</text>
  <g filter="url(#shadow)">
    <rect x="80" y="235" width="390" height="150" rx="24" fill="#fff" stroke="#d9ddd9"/>
    <rect x="605" y="235" width="390" height="150" rx="24" fill="#fff" stroke="#d9ddd9"/>
    <rect x="1130" y="235" width="390" height="150" rx="24" fill="#fff" stroke="#d9ddd9"/>
  </g>
  <circle cx="135" cy="290" r="25" fill="#e8f3f3"/><text x="125" y="297" class="small">W</text>
  <text x="180" y="285" class="boxTitle">Web Application</text><text x="180" y="317" class="boxText">React and Vite</text><text x="180" y="347" class="boxText">Authenticated workspaces</text>
  <circle cx="660" cy="290" r="25" fill="#e8f3f3"/><text x="650" y="297" class="small">M</text>
  <text x="705" y="285" class="boxTitle">Mobile Application</text><text x="705" y="317" class="boxText">React Native and Expo</text><text x="705" y="347" class="boxText">Wallet and QR interaction</text>
  <circle cx="1185" cy="290" r="25" fill="#e8f3f3"/><text x="1175" y="297" class="small">V</text>
  <text x="1230" y="285" class="boxTitle">Public Verifier</text><text x="1230" y="317" class="boxText">Browser or QR scanner</text><text x="1230" y="347" class="boxText">No account required</text>

  <path d="M275 385 L275 454" class="arrow"/><path d="M800 385 L800 454" class="arrow"/><path d="M1325 385 L1325 454" class="arrow"/>
  <text x="240" y="425" class="small">HTTPS</text><text x="765" y="425" class="small">HTTPS</text><text x="1290" y="425" class="small">HTTPS</text>

  <text x="80" y="480" class="section">APPLICATION AND SECURITY LAYER</text>
  <g filter="url(#shadow)"><rect x="80" y="505" width="1440" height="265" rx="30" fill="url(#api)"/></g>
  <text x="125" y="560" class="apiTitle">VerifiedDoc API</text><text x="125" y="592" class="apiText">Node.js, Express 5 and TypeScript</text>
  <rect x="125" y="625" width="300" height="105" rx="18" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.25"/>
  <text x="150" y="662" class="apiTitle" font-size="19">HTTP Security</text><text x="150" y="692" class="apiText">Helmet, CORS, rate limits</text><text x="150" y="718" class="apiText">and sanitized logging</text>
  <rect x="460" y="625" width="300" height="105" rx="18" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.25"/>
  <text x="485" y="662" class="apiTitle" font-size="19">Access Control</text><text x="485" y="692" class="apiText">JWT, role authorization</text><text x="485" y="718" class="apiText">and request validation</text>
  <rect x="795" y="625" width="360" height="105" rx="18" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.25"/>
  <text x="820" y="662" class="apiTitle" font-size="19">Domain Services</text><text x="820" y="692" class="apiText">Auth, organizations, credentials</text><text x="820" y="718" class="apiText">sharing, invitations and audit</text>
  <rect x="1190" y="625" width="285" height="105" rx="18" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.25"/>
  <text x="1215" y="662" class="apiTitle" font-size="19">API Contract</text><text x="1215" y="692" class="apiText">Swagger at /docs</text><text x="1215" y="718" class="apiText">OpenAPI JSON</text>

  <path d="M800 770 L800 835" class="arrow"/>
  <text x="80" y="840" class="section">PERSISTENCE LAYER</text>
  <g filter="url(#shadow)">
    <rect x="300" y="860" width="390" height="100" rx="24" fill="#fff" stroke="#d9ddd9"/>
    <rect x="910" y="860" width="390" height="100" rx="24" fill="#fff" stroke="#d9ddd9"/>
  </g>
  <text x="345" y="904" class="boxTitle">Prisma ORM</text><text x="345" y="933" class="boxText">Schema, constraints and transactions</text>
  <text x="955" y="904" class="boxTitle">Supabase PostgreSQL</text><text x="955" y="933" class="boxText">Persistent source of truth</text>
  <path d="M690 910 L900 910" class="arrow"/>
</svg>
