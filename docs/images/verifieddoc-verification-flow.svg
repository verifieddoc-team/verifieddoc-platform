<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">VerifiedDoc credential sharing and public verification flow</title>
  <desc id="description">A holder creates a consent-based share link, the API stores only a token hash, and a verifier checks the current credential record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ee"/><stop offset="1" stop-color="#f2eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#4e7685"/></marker>
    <style>.title{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:40px;font-weight:700;fill:#172033}.subtitle{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:18px;font-weight:400;fill:#68717b}.step{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:14px;font-weight:700;fill:#a2863d;letter-spacing:1px}.boxTitle{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:20px;font-weight:700;fill:#172033}.boxText{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:15px;font-weight:400;fill:#68717b}.note{font-family:Inter,"DejaVu Sans",Arial,sans-serif;font-size:14px;font-weight:600;fill:#315f6a}.arrow{fill:none;stroke:#4e7685;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="90" r="190" fill="none" stroke="#bdd2d2" stroke-width="2" opacity="0.55"/>
  <g transform="translate(72 60)"><circle cx="28" cy="28" r="26" fill="none" stroke="#2b416f" stroke-width="4"/><path d="M15 29l9 9 18-21" fill="none" stroke="#4e7685" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="39" class="title">Consent-Based Credential Verification</text><text x="70" y="72" class="subtitle">Raw tokens are returned once. Live status is checked at the issuer-backed source.</text></g>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="300" height="190" rx="25" fill="#fff" stroke="#dbdedb"/>
    <rect x="460" y="200" width="300" height="190" rx="25" fill="#fff" stroke="#dbdedb"/>
    <rect x="840" y="200" width="300" height="190" rx="25" fill="#fff" stroke="#dbdedb"/>
    <rect x="1220" y="200" width="300" height="190" rx="25" fill="#fff" stroke="#dbdedb"/>
  </g>
  <text x="115" y="245" class="step">01 HOLDER CONSENT</text><text x="115" y="285" class="boxTitle">Select disclosure</text><text x="115" y="320" class="boxText">Choose credential, claims,</text><text x="115" y="347" class="boxText">identity fields, expiry and</text><text x="115" y="374" class="boxText">maximum views.</text>
  <text x="495" y="245" class="step">02 SECURE CREATION</text><text x="495" y="285" class="boxTitle">Create share link</text><text x="495" y="320" class="boxText">Authenticated POST to the</text><text x="495" y="347" class="boxText">credential share-link API.</text><text x="495" y="374" class="boxText">Ownership is enforced.</text>
  <text x="875" y="245" class="step">03 SAFE STORAGE</text><text x="875" y="285" class="boxTitle">Store token hash</text><text x="875" y="320" class="boxText">Prisma transaction stores</text><text x="875" y="347" class="boxText">SHA-256 hash, limits and</text><text x="875" y="374" class="boxText">an audit record.</text>
  <text x="1255" y="245" class="step">04 SHARE</text><text x="1255" y="285" class="boxTitle">Return URL once</text><text x="1255" y="320" class="boxText">Holder sends the secure URL</text><text x="1255" y="347" class="boxText">or a client-rendered QR code</text><text x="1255" y="374" class="boxText">to a verifier.</text>
  <path d="M380 295 L448 295" class="arrow"/><path d="M760 295 L828 295" class="arrow"/><path d="M1140 295 L1208 295" class="arrow"/>

  <path d="M1370 390 C1370 470 1265 470 1265 530" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="1070" y="540" width="450" height="210" rx="25" fill="#243967"/>
    <rect x="575" y="540" width="410" height="210" rx="25" fill="#fff" stroke="#dbdedb"/>
    <rect x="80" y="540" width="410" height="210" rx="25" fill="#fff" stroke="#dbdedb"/>
  </g>
  <text x="1110" y="588" class="step" fill="#a8ecd1">05 PUBLIC REQUEST</text><text x="1110" y="630" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">GET /api/v1/verify/:token</text><text x="1110" y="667" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#dce8ea">No login required. Rate limiting applies.</text><text x="1110" y="696" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#dce8ea">The API hashes the supplied token.</text>
  <text x="615" y="588" class="step">06 ATOMIC VALIDATION</text><text x="615" y="630" class="boxTitle">Claim one view</text><text x="615" y="667" class="boxText">Link must be active, unexpired,</text><text x="615" y="694" class="boxText">not revoked and below its limit.</text><text x="615" y="721" class="boxText">Live credential data is loaded.</text>
  <text x="120" y="588" class="step">07 PRIVACY-SAFE RESULT</text><text x="120" y="630" class="boxTitle">Return current status</text><text x="120" y="667" class="boxText">VALID, EXPIRED or REVOKED.</text><text x="120" y="694" class="boxText">Unavailable links receive the same</text><text x="120" y="721" class="boxText">generic 404 response.</text>
  <path d="M1070 645 L997 645" class="arrow"/><path d="M575 645 L502 645" class="arrow"/>

  <rect x="80" y="805" width="1440" height="55" rx="17" fill="#e5f3ef"/>
  <text x="115" y="839" class="note">Privacy default: holder name, reference number and claims appear only when the holder explicitly selects them.</text>
</svg>
